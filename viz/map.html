<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Votes With Whom — UN General Assembly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <h1>Who Votes With Whom</h1>
    <span class="header-sub">UN General Assembly · 1946–2025</span>
  </div>
  <div class="header-right">
    <nav class="nav-tabs">
      <button class="nav-tab active">World Map</button>
      <button class="nav-tab">Network</button>
      <button class="nav-tab">Timeline</button>
      <button class="nav-tab">Compare</button>
    </nav>
  </div>
</header>

<div class="workspace">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="control-group">
      <label>Color by</label>
      <select id="metric-select">
        <option value="consensus">Agreement with majority</option>
        <option value="idealpoint">Ideal point (W↔E axis)</option>
        <option value="similarity">Similarity to selected country</option>
      </select>
    </div>

    <div class="control-group">
      <label>Year — <span id="year-label">2024</span></label>
      <input type="range" id="year-slider" min="1946" max="2024" value="2024" step="1">
    </div>

    <div class="control-group">
  <label>Filter by topic</label>
  <select id="topic-select">
    <option value="all">All topics</option>
    <option value="Social, Humanitarian & Cultural">Social, Humanitarian & Cultural</option>
    <option value="Disarmament & International Security">Disarmament & International Security</option>
    <option value="Palestine & Middle East">Palestine & Middle East</option>
    <option value="Special Political & Decolonization">Special Political & Decolonization</option>
    <option value="Economic & Financial">Economic & Financial</option>
    <option value="Environment & Climate">Environment & Climate</option>
    <option value="International Peace & Security">International Peace & Security</option>
    <option value="Global Governance">Global Governance</option>
    <option value="Administrative, Budgetary & Legal">Administrative, Budgetary & Legal</option>
  </select>
</div>

    <div class="divider"></div>

    <div>
      <div class="legend-label">Agreement scale</div>
      <div class="legend-bar"></div>
      <div class="legend-ticks">
        <span>Low</span>
        <span>0.6</span>
        <span>0.8</span>
        <span>High</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="stats-row">
      <div class="stat-pill">
        <div class="stat-val" id="stat-countries">193</div>
        <div class="stat-lbl">Countries</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val" id="stat-resolutions">—</div>
        <div class="stat-lbl">Resolutions</div>
      </div>
    </div>

    <div class="divider"></div>

    <div id="info-card" class="info-card">
      <div class="info-placeholder">Hover a country to inspect</div>
    </div>

  </aside>

  <!-- Map -->
  <main class="map-area">
    <div id="loading">
      <div class="loading-text">Loading map data</div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <svg id="map-svg"></svg>

    <div id="tooltip">
      <div class="tt-name" id="tt-name">—</div>
      <div class="tt-row"><span>Agreement</span><span class="tt-val" id="tt-agreement">—</span></div>
      <div class="tt-row"><span>Ideal point</span><span class="tt-val" id="tt-idealpoint">—</span></div>
      <div class="tt-row"><span>Votes cast</span><span class="tt-val" id="tt-votes">—</span></div>
      <div class="tt-row"><span>ISO code</span><span class="tt-val" id="tt-code">—</span></div>
    </div>

    <div class="map-controls">
      <button class="map-btn" id="zoom-in"  title="Zoom in">+</button>
      <button class="map-btn" id="zoom-out" title="Zoom out">−</button>
      <button class="map-btn" id="zoom-reset" title="Reset view">⊙</button>
    </div>

    <div class="data-tag">
      Source: UN Dag Hammarskjöld Library · Voeten et al., Harvard Dataverse
    </div>
  </main>

</div>

<div id="tooltip"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Configuration
// ─────────────────────────────────────────────────────────────────────────────

const DATA_PATHS = {
  world:       "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
  agreement:   "../data/processed/agreement_overall.csv",
  idealpoints: "../data/processed/un_with_idealpoints.csv",
  country_idx: "../data/processed/country_index.csv",
};

// ─────────────────────────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────────────────────────

const state = {
  year:          2024,
  metric:        "consensus",
  topic:         "all",
  selectedCode:  null,
  data: {
    agreement:   null,   // Map<year, Map<iso3, score>>
    idealpoints: null,   // Map<year, Map<iso3, value>>
    countries:   null,   // Map<iso3, {name, first_year, last_year}>
    resolutions: null,   // Map<year, count>
  }
};

// ─────────────────────────────────────────────────────────────────────────────
//  Color scales
// ─────────────────────────────────────────────────────────────────────────────

const colorAgreement = d3.scaleSequential()
  .domain([0.4, 1.0])
  .interpolator(d3.interpolateRgbBasis(["#c0392b","#e67e22","#27ae60","#2980b9"]));

const colorIdealPoint = d3.scaleSequential()
  .domain([-2.5, 2.5])
  .interpolator(d3.interpolateRgbBasis(["#e74c3c","#95a5a6","#3498db"]));

function getColor(isoCode) {
  const yearData = state.data.agreement?.get(state.year);
  const ipData   = state.data.idealpoints?.get(state.year);

  if (state.metric === "consensus") {
    const val = yearData?.get(isoCode);
    return val != null ? colorAgreement(val) : null;
  }
  if (state.metric === "idealpoint") {
    const val = ipData?.get(isoCode);
    return val != null ? colorIdealPoint(val) : null;
  }
  if (state.metric === "similarity" && state.selectedCode) {
    // Agreement between selected country and this country
    const val = yearData?.get(isoCode + "__" + state.selectedCode)
             ?? yearData?.get(state.selectedCode + "__" + isoCode);
    return val != null ? colorAgreement(val) : null;
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Data loading
// ─────────────────────────────────────────────────────────────────────────────

async function loadData() {
  // Load TopoJSON world map
  let world;
  try {
    world = await d3.json(DATA_PATHS.world);
  } catch(e) {
    // Fallback: use a minimal inline world if CDN unavailable
    console.warn("Could not load world atlas, using placeholder");
    world = null;
  }

  // Load CSV data files
  let agreementRaw, idealpointsRaw, countryRaw;
  try {
    [agreementRaw, idealpointsRaw, countryRaw] = await Promise.all([
      d3.csv(DATA_PATHS.agreement),
      d3.csv(DATA_PATHS.idealpoints),
      d3.csv(DATA_PATHS.country_idx),
    ]);
  } catch(e) {
    console.warn("CSV data files not found — using demo data");
    agreementRaw = null;
  }

  // Build agreement lookup: year -> iso -> consensus score
  // consensus = average agreement with all other countries in that year
  const agreementMap = new Map();
  const pairMap      = new Map(); // year -> "c1__c2" -> score

  if (agreementRaw) {
    // First pass: collect all scores per country per year
    const byYear = d3.group(agreementRaw, d => +d.year);
    for (const [yr, rows] of byYear) {
      const countryScores = new Map();
      const pairs = new Map();

      for (const r of rows) {
        const score = +r.agreement;
        const c1 = r.ms_code1, c2 = r.ms_code2;
        pairs.set(c1 + "__" + c2, score);

        if (!countryScores.has(c1)) countryScores.set(c1, []);
        if (!countryScores.has(c2)) countryScores.set(c2, []);
        countryScores.get(c1).push(score);
        countryScores.get(c2).push(score);
      }

      // Average score per country = "consensus" metric
      const consensusMap = new Map();
      for (const [code, scores] of countryScores) {
        consensusMap.set(code, d3.mean(scores));
      }
      agreementMap.set(yr, consensusMap);
      pairMap.set(yr, pairs);
    }
  }

  // Build ideal points lookup: year -> iso -> IdealPointFP
  const ipMap = new Map();
  if (idealpointsRaw) {
    const byYear = d3.group(idealpointsRaw, d => +d.year);
    for (const [yr, rows] of byYear) {
      const m = new Map();
      for (const r of rows) {
        if (r.IdealPointFP && r.ms_code)
          m.set(r.ms_code, +r.IdealPointFP);
      }
      ipMap.set(yr, m);
    }
  }

  // Build country index
  const countryMap = new Map();
  if (countryRaw) {
    for (const r of countryRaw) {
      countryMap.set(r.ms_code, {
        name:       r.country_name,
        first_year: +r.first_year,
        last_year:  +r.last_year,
      });
    }
  }

  state.data.agreement   = agreementMap;
  state.data.pairMap     = pairMap;
  state.data.idealpoints = ipMap;
  state.data.countries   = countryMap;

  return world;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Map rendering
// ─────────────────────────────────────────────────────────────────────────────

function initMap(world) {
  const svg    = d3.select("#map-svg");
  const width  = svg.node().clientWidth;
  const height = svg.node().clientHeight;

  const projection = d3.geoNaturalEarth1()
    .scale(width / 6.4)
    .translate([width / 2, height / 2]);

  const path = d3.geoPath().projection(projection);

  // Zoom behavior
  const zoom = d3.zoom()
    .scaleExtent([0.8, 8])
    .on("zoom", e => g.attr("transform", e.transform));

  svg.call(zoom);

  const g = svg.append("g");

  // Sphere (ocean)
  g.append("path")
    .datum({type: "Sphere"})
    .attr("class", "sphere")
    .attr("d", path);

  // Graticule
  g.append("path")
    .datum(d3.geoGraticule()())
    .attr("class", "graticule")
    .attr("d", path);

  let countries = [];
  if (world) {
    countries = topojson.feature(world, world.objects.countries).features;
  }

  // Build iso3 lookup from numeric id
  // We'll use the country data to resolve names
  const numToIso = buildNumericToIsoMap();

  // Draw countries
  const paths = g.selectAll(".country-path")
    .data(countries)
    .join("path")
    .attr("class", "country-path")
    .attr("d", path)
    .attr("data-id", d => d.id);

  updateColors(paths, numToIso);

  // Tooltip
  const tooltip = d3.select("#tooltip");

  paths
    .on("mousemove", function(event, d) {
      const iso  = numToIso.get(+d.id);
      const info = iso ? state.data.countries?.get(iso) : null;
      const agr  = iso ? state.data.agreement?.get(state.year)?.get(iso) : null;
      const ip   = iso ? state.data.idealpoints?.get(state.year)?.get(iso) : null;

      d3.select("#tt-name").text(info?.name ?? iso ?? "Unknown");
      d3.select("#tt-agreement").text(agr != null ? (agr * 100).toFixed(1) + "%" : "—");
      d3.select("#tt-idealpoint").text(ip  != null ? ip.toFixed(3) : "—");
      d3.select("#tt-code").text(iso ?? "—");
      d3.select("#tt-votes").text("—");

      tooltip
        .classed("visible", true)
        .style("left", (event.offsetX + 16) + "px")
        .style("top",  (event.offsetY - 10) + "px");

      // Sidebar info card
      updateInfoCard(iso, info, agr, ip);
    })
    .on("mouseleave", function() {
      tooltip.classed("visible", false);
    })
    .on("click", function(event, d) {
      const iso = numToIso.get(+d.id);
      if (!iso) return;
      state.selectedCode = iso;
      paths.classed("selected", dd => numToIso.get(+dd.id) === iso);
      if (state.metric === "similarity") updateColors(paths, numToIso);
    });

  // Zoom controls
  d3.select("#zoom-in").on("click",    () => svg.transition().call(zoom.scaleBy, 1.5));
  d3.select("#zoom-out").on("click",   () => svg.transition().call(zoom.scaleBy, 0.67));
  d3.select("#zoom-reset").on("click", () => svg.transition().call(zoom.transform, d3.zoomIdentity));

  // Controls
  d3.select("#year-slider").on("input", function() {
    state.year = +this.value;
    d3.select("#year-label").text(state.year);
    updateColors(paths, numToIso);
  });

  d3.select("#metric-select").on("change", function() {
    state.metric = this.value;
    updateColors(paths, numToIso);
  });

  d3.select("#topic-select").on("change", function() {
    state.topic = this.value;
    updateColors(paths, numToIso);
  });

  // Window resize
  window.addEventListener("resize", () => {
    const w = svg.node().clientWidth;
    const h = svg.node().clientHeight;
    projection.scale(w / 6.4).translate([w / 2, h / 2]);
    g.selectAll(".country-path").attr("d", path);
    g.select(".sphere").attr("d", path);
    g.select(".graticule").attr("d", path);
  });

  return { paths, numToIso, zoom, svg };
}

function updateColors(paths, numToIso) {
  const yearData = state.data.agreement?.get(state.year);
  const ipData   = state.data.idealpoints?.get(state.year);

  paths.attr("fill", d => {
    const iso = numToIso.get(+d.id);
    if (!iso) return "#1a2a40";

    if (state.metric === "consensus") {
      const val = yearData?.get(iso);
      return val != null ? colorAgreement(val) : "#1a2a40";
    }
    if (state.metric === "idealpoint") {
      const val = ipData?.get(iso);
      return val != null ? colorIdealPoint(val) : "#1a2a40";
    }
    if (state.metric === "similarity" && state.selectedCode) {
      const pairData = state.data.pairMap?.get(state.year);
      const key1 = iso + "__" + state.selectedCode;
      const key2 = state.selectedCode + "__" + iso;
      const val  = pairData?.get(key1) ?? pairData?.get(key2);
      if (iso === state.selectedCode) return "#ffffff";
      return val != null ? colorAgreement(val) : "#1a2a40";
    }
    return "#1a2a40";
  });
}

function updateInfoCard(iso, info, agr, ip) {
  const card = d3.select("#info-card");
  if (!iso || !info) {
    card.html('<div class="info-placeholder">Hover a country to inspect</div>');
    card.classed("active", false);
    return;
  }
  card.classed("active", true);
  card.html(`
    <div class="info-country">${info.name ?? iso}</div>
    <div class="info-row">
      <span>ISO code</span>
      <span class="info-val">${iso}</span>
    </div>
    <div class="info-row">
      <span>Avg agreement</span>
      <span class="info-val">${agr != null ? (agr * 100).toFixed(1) + "%" : "—"}</span>
    </div>
    <div class="info-row">
      <span>Ideal point</span>
      <span class="info-val">${ip != null ? ip.toFixed(3) : "—"}</span>
    </div>
    <div class="info-row">
      <span>UN member since</span>
      <span class="info-val">${info.first_year ?? "—"}</span>
    </div>
  `);
}

// ─────────────────────────────────────────────────────────────────────────────
//  ISO numeric → ISO3 mapping
//  Uses UN M49 numeric codes as used by Natural Earth / world-atlas
// ─────────────────────────────────────────────────────────────────────────────

function buildNumericToIsoMap() {
  // Mapping of UN numeric country codes to ISO 3166-1 alpha-3
  const raw = {
    4:"AFG",8:"ALB",12:"DZA",24:"AGO",32:"ARG",36:"AUS",40:"AUT",50:"BGD",
    56:"BEL",68:"BOL",76:"BRA",100:"BGR",104:"MMR",116:"KHM",120:"CMR",
    124:"CAN",140:"CAF",152:"CHL",156:"CHN",170:"COL",178:"COG",180:"COD",
    188:"CRI",191:"HRV",192:"CUB",196:"CYP",203:"CZE",204:"BEN",208:"DNK",
    214:"DOM",218:"ECU",818:"EGY",222:"SLV",231:"ETH",246:"FIN",250:"FRA",
    266:"GAB",276:"DEU",288:"GHA",300:"GRC",320:"GTM",324:"GIN",332:"HTI",
    340:"HND",348:"HUN",356:"IND",360:"IDN",364:"IRN",368:"IRQ",372:"IRL",
    376:"ISR",380:"ITA",388:"JAM",392:"JPN",400:"JOR",404:"KEN",410:"KOR",
    414:"KWT",418:"LAO",422:"LBN",430:"LBR",434:"LBY",442:"LUX",454:"MWI",
    458:"MYS",484:"MEX",504:"MAR",508:"MOZ",516:"NAM",524:"NPL",528:"NLD",
    540:"NCL",554:"NZL",558:"NIC",562:"NER",566:"NGA",578:"NOR",586:"PAK",
    591:"PAN",598:"PNG",600:"PRY",604:"PER",608:"PHL",616:"POL",620:"PRT",
    630:"PRI",634:"QAT",642:"ROU",643:"RUS",646:"RWA",682:"SAU",686:"SEN",
    694:"SLE",706:"SOM",710:"ZAF",724:"ESP",144:"LKA",729:"SDN",752:"SWE",
    756:"CHE",760:"SYR",762:"TJK",764:"THA",768:"TGO",780:"TTO",788:"TUN",
    792:"TUR",800:"UGA",804:"UKR",784:"ARE",826:"GBR",840:"USA",858:"URY",
    860:"UZB",862:"VEN",704:"VNM",887:"YEM",894:"ZMB",716:"ZWE",
    012:"DZA",051:"ARM",031:"AZE",112:"BLR",064:"BTN",072:"BWA",
    854:"BFA",108:"BDI",132:"CPV",116:"KHM",140:"CAF",148:"TCD",
    174:"COM",384:"CIV",262:"DJI",232:"ERI",230:"ETH",238:"FLK",
    242:"FJI",266:"GAB",270:"GMB",288:"GHA",308:"GRD",324:"GIN",
    624:"GNB",328:"GUY",332:"HTI",356:"IND",360:"IDN",418:"LAO",
    426:"LSO",430:"LBR",450:"MDG",454:"MWI",466:"MLI",478:"MRT",
    480:"MUS",496:"MNG",498:"MDA",504:"MAR",516:"NAM",524:"NPL",
    562:"NER",566:"NGA",585:"PLW",598:"PNG",275:"PSE",608:"PHL",
    646:"RWA",670:"VCT",882:"WSM",678:"STP",686:"SEN",694:"SLE",
    90:"SLB",706:"SOM",740:"SUR",748:"SWZ",762:"TJK",626:"TLS",
    768:"TGO",776:"TON",798:"TUV",800:"UGA",548:"VUT",887:"YEM",
    894:"ZMB",716:"ZWE",492:"MCO",807:"MKD",499:"MNE",688:"SRB",
    705:"SVN",703:"SVK",440:"LTU",428:"LVA",233:"EST",417:"KGZ",
    795:"TKM",860:"UZB",398:"KAZ",496:"MNG",408:"PRK",408:"PRK",
  };
  return new Map(Object.entries(raw).map(([k,v]) => [+k, v]));
}

// ─────────────────────────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────────────────────────

(async () => {
  const world = await loadData();
  document.getElementById("loading").style.display = "none";

  if (world) {
    initMap(world);
  } else {
    document.querySelector(".map-area").innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#3d5478;font-size:12px;letter-spacing:0.1em;">
        MAP REQUIRES INTERNET CONNECTION TO LOAD WORLD TOPOLOGY<br>
        Run from a local server with internet access.
       </div>`;
  }

  // Update resolution count stat
  const yearData = state.data.agreement?.get(state.year);
  if (yearData) {
    d3.select("#stat-countries").text(yearData.size);
  }
})();
</script>
</body>
</html>
