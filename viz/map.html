<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Votes With Whom — UN General Assembly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
</head>
<body>

<!-- SVG defs for hatch pattern -->
<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    </pattern>
  </defs>
</svg>

<!-- Header -->
<header>
  <div class="header-left">
    <h1>Who Votes With Whom</h1>
    <span class="header-sub">UN General Assembly · 1946–2025</span>
  </div>
  <div class="header-right">
    <nav class="nav-tabs">

      <button
        id="country-story-tab"
        class="nav-tab nav-tab-context"
        style="display:none"
        onclick="openStory()">
        Country Story
      </button>

      <button
        id="country-detail-tab"
        class="nav-tab nav-tab-context"
        style="display:none"
        onclick="openCountry()">
        Country Detail
      </button>

      <button class="nav-tab active">
        World Map
      </button>

      <button
        class="nav-tab"
        onclick="window.location.href='compare.html'">
        Compare Countries
      </button>

    </nav>
  </div>
</header>

<div class="workspace">

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Controls -->
    <div class="control-group">
      <label>Color by</label>
      <select id="metric-select">
        <option value="consensus">Agreement with majority</option>
        <option value="idealpoint">Ideal point (W↔E axis)</option>
        <option value="similarity">Similarity to selected country</option>
      </select>
    </div>

    <!-- Year Slider -->
    <div class="control-group">
      <label>Year — <span id="year-label">2024</span></label>
      <input type="range" id="year-slider" min="1946" max="2024" value="2024" step="1">
    </div>

    <!-- Topic Filter -->
    <div class="control-group" id="topic-control">
      <label>Filter by topic</label>
      <select id="topic-select">
        <option value="all">All topics</option>
        <option value="Social, Humanitarian & Cultural">Social, Humanitarian & Cultural</option>
        <option value="Disarmament & International Security">Disarmament & International Security</option>
        <option value="Palestine & Middle East">Palestine & Middle East</option>
        <option value="Special Political & Decolonization">Special Political & Decolonization</option>
        <option value="Economic & Financial">Economic & Financial</option>
        <option value="Environment & Climate">Environment & Climate</option>
        <option value="International Peace & Security">International Peace & Security</option>
        <option value="Global Governance">Global Governance</option>
        <option value="Administrative, Budgetary & Legal">Administrative, Budgetary & Legal</option>
      </select>
    </div>

    <div class="divider"></div>

    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div class="legend-label" style="margin-bottom:0;">Agreement scale</div>
        <button id="cb-palette-toggle" title="Toggle colorblind-safe palette"
          style="background:none;border:1px solid var(--border);border-radius:4px;
          color:var(--text-muted);font-size:9px;letter-spacing:0.06em;
          padding:2px 7px;cursor:pointer;font-family:'JetBrains Mono',monospace;
          transition:all 0.15s;">👁 CB</button>
      </div>
      <div class="legend-bar" id="legend-bar"></div>
      <div class="legend-ticks">
        <span>Low</span>
        <span>0.6</span>
        <span>0.8</span>
        <span>High</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Stats -->
    <div class="stats-row" id="stats-control">
      <div class="stat-pill">
        <div class="stat-val" id="stat-countries">—</div>
        <div class="stat-lbl">Countries</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val" id="stat-resolutions">—</div>
        <div class="stat-lbl">Resolutions</div>
      </div>
    </div>

    <div class="divider"></div>

    <div id="info-card" class="info-card">
      <div class="info-placeholder">Hover a country to inspect</div>
    </div>

  </aside>

  <!-- Map -->
  <main class="map-area">
    <div id="loading">
      <div class="loading-text" id="loading-text">Initialising database</div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
      <div id="loading-progress" style="font-size:10px;color:#3d5478;margin-top:8px;letter-spacing:0.08em;"></div>
    </div>

    <svg id="map-svg"></svg>

    <div id="tooltip">
      <div class="tt-name" id="tt-name">—</div>
      <div class="tt-row"><span>Agreement</span><span class="tt-val" id="tt-agreement">—</span></div>
      <div class="tt-row"><span>Ideal point</span><span class="tt-val" id="tt-idealpoint">—</span></div>
      <div class="tt-row"><span>Votes cast</span><span class="tt-val" id="tt-votes">—</span></div>
      <div class="tt-row"><span>ISO code</span><span class="tt-val" id="tt-code">—</span></div>
    </div>

    <div class="map-controls">
      <button class="map-btn" id="zoom-in"  title="Zoom in">+</button>
      <button class="map-btn" id="zoom-out" title="Zoom out">−</button>
      <button class="map-btn" id="zoom-reset" title="Reset view">⊙</button>
    </div>

    <div class="data-tag">
      Source: UN Dag Hammarskjöld Library · Voeten et al., Harvard Dataverse
    </div>
  </main>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Configuration
// ─────────────────────────────────────────────────────────────────────────────

const DATA_PATHS = {
  world:    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json",
  database: "../data/processed/votes.db",
  sqlwasm:  "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.wasm",
};

// ─────────────────────────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────────────────────────

const state = {
  year:         2024,
  metric:       "consensus",
  topic:        "all",
  selectedCode: null,
  pinnedCode:   null,
  data: {
    agreement:   new Map(), // Map<year, Map<iso3, consensus>>
    categories:  new Map(), // Map<category, Map<year, Map<iso3, consensus>>>
    idealpoints: new Map(), // Map<year, Map<iso3, value>>
    countries:   new Map(), // Map<iso3, {country_name, first_year, last_year}>
    resolutions: new Map(), // Map<year, n_resolutions>
    resByCat:    new Map(), // Map<"year__category", n_resolutions>
    similarity:  new Map(), // Map<"year__code", Map<iso3, agreement>>
  }
};

// Global database handle — set once on load
let DB = null;

// ─────────────────────────────────────────────────────────────────────────────
//  SQL helper
// ─────────────────────────────────────────────────────────────────────────────

function query(sql, params = []) {
  if (!DB) return [];
  const stmt = DB.prepare(sql);
  stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Color scales
// ─────────────────────────────────────────────────────────────────────────────

const colorAgreement = d3.scaleSequential()
  .domain([0.4, 1.0])
  .interpolator(d3.interpolateRgbBasis(["#c0392b","#e67e22","#27ae60","#2980b9"]));

const colorIdealPoint = d3.scaleSequential()
  .domain([-2.5, 2.5])
  .interpolator(d3.interpolateRgbBasis(["#e74c3c","#95a5a6","#3498db"]));

// ─────────────────────────────────────────────────────────────────────────────
//  Data loading
// ─────────────────────────────────────────────────────────────────────────────

async function loadData() {
  const loadingText     = document.getElementById("loading-text");
  const loadingProgress = document.getElementById("loading-progress");

  // ── Load world topology ───────────────────────────────────────────────────
  loadingText.textContent = "Loading map topology";
  const world = await d3.json(DATA_PATHS.world).catch(() => null);

  // ── Initialise sql.js ─────────────────────────────────────────────────────
  loadingText.textContent = "Initialising database engine";
  const SQL = await initSqlJs({ locateFile: () => DATA_PATHS.sqlwasm });

  // ── Fetch votes.db with progress ──────────────────────────────────────────
  loadingText.textContent = "Loading database";
  const response = await fetch(DATA_PATHS.database);
  const contentLength = response.headers.get("content-length");
  const totalMB = contentLength ? (contentLength / 1024 / 1024).toFixed(0) : "?";

  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    const mb = (received / 1024 / 1024).toFixed(0);
    loadingProgress.textContent = `${mb} / ${totalMB} MB`;
  }

  // Concatenate chunks into a single Uint8Array
  const buffer = new Uint8Array(received);
  let offset = 0;
  for (const chunk of chunks) {
    buffer.set(chunk, offset);
    offset += chunk.length;
  }

  loadingText.textContent = "Parsing database";
  loadingProgress.textContent = "";
  DB = new SQL.Database(buffer);

  // ── Load static lookup tables into memory ─────────────────────────────────
  // Countries, ideal points, and resolution counts are small and static — loading them once into Maps
  // avoids repeated DB queries during user interactions like hovering and slider movement.
  loadingText.textContent = "Loading country data";

  // Countries
  for (const r of query("SELECT ms_code, country_name, first_year, last_year, iso2 FROM countries")) {
    state.data.countries.set(r.ms_code, r);
  }

  // Ideal points — nested: year → ms_code → value
  for (const r of query("SELECT ms_code, year, ideal_point FROM ideal_points")) {
    if (!state.data.idealpoints.has(r.year)) state.data.idealpoints.set(r.year, new Map());
    state.data.idealpoints.get(r.year).set(r.ms_code, r.ideal_point);
  }

  // Resolution counts overall
  for (const r of query("SELECT year, n_resolutions FROM resolution_counts")) {
    state.data.resolutions.set(r.year, r.n_resolutions);
  }

  // Resolution counts by category
  for (const r of query("SELECT year, category_name, n_resolutions FROM resolution_counts_named")) {
    state.data.resByCat.set(`${r.year}__${r.category_name}`, r.n_resolutions);
  }

  // ── Load consensus for default year ───────────────────────────────────────
  loadingText.textContent = "Loading voting data";
  loadYearConsensus(state.year);

  return world;
}

// ─────────────────────────────────────────────────────────────────────────────
//  On-demand data loaders (cached after first load)
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Loads per-country consensus scores for a given year from mat_consensus_overall.
 * Results are cached in state.data.agreement - subsequent calls for the same year are no-ops.
 */
function loadYearConsensus(year) {
  if (state.data.agreement.has(year)) return;
  const m = new Map();
  for (const r of query(
    "SELECT ms_code, consensus FROM mat_consensus_overall WHERE year = ?", [year]
  )) {
    m.set(r.ms_code, r.consensus);
  }
  state.data.agreement.set(year, m);
}

/**
 * Loads per-country consensus scores for a given year and topic from mat_consensus_by_category.
 * Results are cached in state.data.categories. Also updates the topic notice with data quality info.
 */
function loadTopicConsensus(year, topic) {
  if (!state.data.categories.has(topic)) {
    state.data.categories.set(topic, new Map());
  }

  if (state.data.categories.get(topic).has(year)) return;

  const m = new Map();

  for (const r of query(
    "SELECT ms_code, consensus FROM mat_consensus_by_category WHERE year = ? AND category_name = ?",
    [year, topic]
  )) {
    m.set(r.ms_code, r.consensus);
  }

  state.data.categories.get(topic).set(year, m);

  // Simple topic banner
  const notice = document.getElementById("topic-notice");

  notice.textContent = "Showing: " + topic;
  notice.style.color = "#4a9eff";
  notice.style.display = "block";
}

/**
 * Loads pairwise agreement scores between a selected country and all others for a given year.
 * Queries agreement_overall directly (not the materialized view) since this is pair-level data.
 * Results are cached in state.data.similarity under the key "year__ms_code".
 */
function loadSimilarity(year, selectedCode) {
  const key = `${year}__${state.topic}__${selectedCode}`;
  if (state.data.similarity.has(key)) return;

  const m = new Map();

  if (state.topic === "all") {
    for (const r of query(`
      SELECT
        CASE WHEN ms_code1 = ? THEN ms_code2 ELSE ms_code1 END AS other_code,
        agreement
      FROM agreement_overall
      WHERE year = ? AND (ms_code1 = ? OR ms_code2 = ?)`,
      [selectedCode, year, selectedCode, selectedCode]
    )) {
      m.set(r.other_code, r.agreement);
    }
  } else {
    for (const r of query(`
      SELECT
        CASE WHEN a.ms_code1 = ? THEN a.ms_code2 ELSE a.ms_code1 END AS other_code,
        a.agreement
      FROM agreement_by_category a
      JOIN categories c ON a.category_id = c.category_id
      WHERE a.year = ?
        AND c.category_name = ?
        AND (a.ms_code1 = ? OR a.ms_code2 = ?)`,
      [selectedCode, year, state.topic, selectedCode, selectedCode]
    )) {
      m.set(r.other_code, r.agreement);
    }
  }

  state.data.similarity.set(key, m);
}

function isDataSparse(year, topic) {
  if (topic === "all") return false;
  return (state.data.resByCat.get(`${year}__${topic}`) ?? 0) < 5;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Updaters
// ─────────────────────────────────────────────────────────────────────────────
 /**
 * Updates the Countries and Resolutions counters in the sidebar.
 * When a topic is selected, shows counts for that topic in the current year.
 * When showing all topics, shows overall counts for the current year.
 */
 
function updateUIForMetric() {
  const isIdealPoint = state.metric === "idealpoint";

  d3.select("#topic-control")
    .style("display", isIdealPoint ? "none" : null);

  d3.select("#stats-control")
    .style("display", isIdealPoint ? "none" : null);

  d3.select("#topic-notice")
    .style("display", isIdealPoint ? "none" : null);
}

function updateStats() {
  if (state.topic !== "all") {
    const catYear = state.data.categories.get(state.topic)?.get(state.year);
    d3.select("#stat-countries").text(catYear ? catYear.size : "—");
    const nRes = state.data.resByCat.get(`${state.year}__${state.topic}`) ?? "—";
    d3.select("#stat-resolutions").text(nRes);
  } else {
    const yearData = state.data.agreement.get(state.year);
    d3.select("#stat-countries").text(yearData ? yearData.size : "—");
    d3.select("#stat-resolutions").text(state.data.resolutions.get(state.year) ?? "—");
  }
}

/**
 * Recolors all country paths based on the current metric, year, and topic.
 * Three modes: consensus (average agreement), idealpoint (W↔E axis), similarity (vs selected country).
 * Countries with no data for the current selection are shown in a neutral dark color.
 */
function updateColors(paths, numToIso) {
  const yearConsensus = state.data.agreement.get(state.year);
  const ipYear        = state.data.idealpoints.get(state.year);

  paths.attr("fill", d => {
    const iso = numToIso.get(+d.id);
    if (!iso) return "#1a2a40";

    if (state.metric === "consensus") {
      if (state.topic !== "all") {
        const val = state.data.categories.get(state.topic)?.get(state.year)?.get(iso);
        return val != null ? colorAgreement(val) : "#2a3a50";
      }
      const val = yearConsensus?.get(iso);
      return val != null ? colorAgreement(val) : "#1a2a40";
    }

    if (state.metric === "idealpoint") {
      const val = ipYear?.get(iso);
      return val != null ? colorIdealPoint(val) : "#1a2a40";
    }

    if (state.metric === "similarity" && state.selectedCode) {
      if (iso === state.selectedCode) return "#ffffff";
      const key = `${state.year}__${state.topic}__${state.selectedCode}`;
      const val = state.data.similarity.get(key)?.get(iso);
      return val != null ? colorAgreement(val) : "#1a2a40";
    }

    return "#1a2a40";
  });
}

/**
 * Applies a diagonal hatch overlay to countries when the selected topic has sparse data (< 5 resolutions).
 * Only hatches countries that have a color — countries with no data at all stay plain.
 * Has no effect when showing all topics or when data is sufficient.
 */
function updateHatch(hatchPaths, numToIso) {
  const sparse = isDataSparse(state.year, state.topic);
  hatchPaths.attr("fill", d => {
    if (!sparse) return "none";
    const iso = numToIso.get(+d.id);
    if (!iso) return "none";
    const hasData = state.data.categories.get(state.topic)?.get(state.year)?.get(iso) != null;
    return hasData ? "url(#hatch)" : "none";
  });
}
/**
 * Updates the country detail card in the sidebar when a country is hovered.
 * Shows country name, ISO code, average agreement score, ideal point, and UN membership start year.
 * Resets to placeholder text when no country is hovered.
 */
function updateInfoCard(iso, info, agr, ip) {
  const card = d3.select("#info-card");
  if (!iso || !info) {
    card.html('<div class="info-placeholder">Hover a country to inspect</div>');
    card.classed("active", false);
    return;
  }
  card.classed("active", true);
  card.html(`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      ${info.iso2
        ? `<img src="https://flagcdn.com/24x18/${info.iso2}.png" 
              srcset="https://flagcdn.com/48x36/${info.iso2}.png 2x"
              style="border-radius:2px;flex-shrink:0;"
              alt="${info.country_name}">`
        : ""}
      <div class="info-country">${info.country_name ?? iso}</div>
    </div>
    <div class="info-row">
      <span>ISO code</span>
      <span class="info-val">${iso}</span>
    </div>
    <div class="info-row">
      <span>Avg agreement</span>
      <span class="info-val">${agr != null ? (agr * 100).toFixed(1) + "%" : "—"}</span>
    </div>
    <div class="info-row">
      <span>Ideal point</span>
      <span class="info-val">${ip != null ? ip.toFixed(3) : "—"}</span>
    </div>
    <div class="info-row">
      <span>UN member since</span>
      <span class="info-val">${info.first_year ?? "—"}</span>
    </div>
  `);
}

function openCountry() {
  if (state.selectedCode) {
    window.location.href =
      `country.html?code=${state.selectedCode}`;
  }
}

function openStory() {
  if (state.selectedCode) {
    window.location.href =
      `story.html?code=${state.selectedCode}`;
  }
}

function updateCountryTabs(iso) {
  const info = state.data.countries.get(iso);

  const detailTab = document.getElementById("country-detail-tab");
  const storyTab  = document.getElementById("country-story-tab");

  if (!info) return;

  detailTab.textContent = `${info.country_name} Data`;
  storyTab.textContent  = `${info.country_name}'s Story`;

  detailTab.style.display = "block";
  storyTab.style.display  = "block";
}

// ─────────────────────────────────────────────────────────────────────────────
//  Map
// ─────────────────────────────────────────────────────────────────────────────

function initMap(world) {
  const svg    = d3.select("#map-svg");
  const width  = svg.node().clientWidth;
  const height = svg.node().clientHeight;

  let paths, hatchPaths;

  const projection = d3.geoNaturalEarth1()
    .scale(width / 6.4)
    .translate([width / 2, height / 2]);

  const path = d3.geoPath().projection(projection);

  const zoom = d3.zoom()
    .scaleExtent([0.8, 8])
    .on("zoom", e => g.attr("transform", e.transform));

  svg.call(zoom);

  const g = svg.append("g");

  g.append("path")
    .datum({type: "Sphere"})
    .attr("class", "sphere")
    .attr("d", path);

  g.append("path")
    .datum(d3.geoGraticule()())
    .attr("class", "graticule")
    .attr("d", path);

  const countries = world
    ? topojson.feature(world, world.objects.countries).features
    : [];

  const numToIso = buildNumericToIsoMap();

  paths = g.selectAll(".country-path")
    .data(countries)
    .join("path")
    .attr("class", "country-path")
    .attr("d", path)
    .attr("data-id", d => d.id);

  hatchPaths = g.selectAll(".country-hatch")
    .data(countries)
    .join("path")
    .attr("class", "country-hatch")
    .attr("d", path)
    .attr("fill", "none")
    .attr("pointer-events", "none");

  updateColors(paths, numToIso);
  updateHatch(hatchPaths, numToIso);

  const tooltip = d3.select("#tooltip");

  paths
    .on("mousemove", function(event, d) {
      const iso  = numToIso.get(+d.id);
      const info = iso ? state.data.countries.get(iso) : null;

      let agr = null;
      if (state.metric === "consensus") {
        agr = state.topic !== "all"
          ? state.data.categories.get(state.topic)?.get(state.year)?.get(iso) ?? null
          : state.data.agreement.get(state.year)?.get(iso) ?? null;
      } else if (state.metric === "similarity" && state.selectedCode) {
        agr = state.data.similarity
          .get(`${state.year}__${state.topic}__${state.selectedCode}`)
          ?.get(iso) ?? null;
      }

      const ip = iso ? state.data.idealpoints.get(state.year)?.get(iso) ?? null : null;
      if (!state.pinnedCode) {
        updateInfoCard(iso, info, agr, ip);
      }
      svg.on("click", function(event) {
      if (event.target.tagName !== "path") {
        state.pinnedCode = null;
        updateInfoCard();
        paths.classed("selected", false);
        document.getElementById("country-story-tab").style.display = "none";
        document.getElementById("country-detail-tab").style.display = "none";

        // Auto-switch back to consensus if we were in similarity mode
        if (state.metric === "similarity") {
          state.metric = "consensus";
          document.getElementById("metric-select").value = "consensus";
          updateColors(paths, numToIso);
          updateHatch(hatchPaths, numToIso);
        }
      }
    });

      d3.select("#tt-name").text(info?.country_name ?? iso ?? "Unknown");
      d3.select("#tt-agreement").text(agr != null ? (agr * 100).toFixed(1) + "%" : "—");
      d3.select("#tt-idealpoint").text(ip != null ? ip.toFixed(3) : "—");
      d3.select("#tt-code").text(iso ?? "—");
      d3.select("#tt-votes").text("—");

      tooltip
        .classed("visible", true)
        .style("left", (event.offsetX + 16) + "px")
        .style("top",  (event.offsetY - 10) + "px");
    })
    .on("mouseleave", () => tooltip.classed("visible", false))
    .on("click", function(event, d) {
      const iso = numToIso.get(+d.id);
      if (!iso) return;

      state.selectedCode = iso;

      document.getElementById("country-story-tab").style.display = "block";
      document.getElementById("country-detail-tab").style.display = "block";

      updateCountryTabs(iso);

      const info = state.data.countries.get(iso);

      // Auto-switch to similarity mode
      if (state.metric !== "similarity") {
        state.metric = "similarity";
        document.getElementById("metric-select").value = "similarity";
      }
      loadSimilarity(state.year, iso);

      let agr = null;
      if (state.metric === "consensus") {
        agr = state.topic !== "all"
          ? state.data.categories.get(state.topic)?.get(state.year)?.get(iso) ?? null
          : state.data.agreement.get(state.year)?.get(iso) ?? null;
      } else if (state.metric === "similarity") {
        agr = 1.0;
      }

      const ip = state.data.idealpoints.get(state.year)?.get(iso) ?? null;

      updateInfoCard(iso, info, agr, ip);

      paths.classed("selected", dd => numToIso.get(+dd.id) === iso);

      if (state.metric === "similarity") {
        updateColors(paths, numToIso);
        updateHatch(hatchPaths, numToIso);
      }
    });

  d3.select("#zoom-in").on("click",    () => svg.transition().call(zoom.scaleBy, 1.5));
  d3.select("#zoom-out").on("click",   () => svg.transition().call(zoom.scaleBy, 0.67));
  d3.select("#zoom-reset").on("click", () => svg.transition().call(zoom.transform, d3.zoomIdentity));

  // ── CB palette toggle ──────────────────────────────────────────────────────
  const PALETTE_SUNSET  = ["#A50026","#F67E4B","#FEDA8B","#98CAE1","#4A7BB7","#364B9A"];
  const PALETTE_CLASSIC = ["#c0392b","#e67e22","#27ae60","#2980b9"];
  let cbPaletteActive = false; // starts with classic

    const cbBtn = document.getElementById("cb-palette-toggle");
  cbBtn.style.background = "#244f82";
  cbBtn.style.color      = "#6bb6ff";
  cbBtn.style.borderColor = "#244f82";

  cbBtn.addEventListener("click", () => {
    cbPaletteActive = !cbPaletteActive;
    const palette = cbPaletteActive ? PALETTE_SUNSET : PALETTE_CLASSIC;
    colorAgreement.interpolator(d3.interpolateRgbBasis(palette));

    // Update legend bar
    const stops = palette.join(", ");
    document.getElementById("legend-bar").style.background =
      `linear-gradient(to right, ${stops})`;

    // Update button state
    cbBtn.style.background  = cbPaletteActive ? "#244f82" : "none";
    cbBtn.style.color       = cbPaletteActive ? "#6bb6ff" : "var(--text-muted)";
    cbBtn.style.borderColor = cbPaletteActive ? "#244f82" : "var(--border)";

    updateColors(paths, numToIso);
  });

  d3.select("#year-slider").on("input", function() {
    state.year = +this.value;
    d3.select("#year-label").text(state.year);
    loadYearConsensus(state.year);
    if (state.metric !== "idealpoint" && state.topic !== "all") {
      loadTopicConsensus(state.year, state.topic);
    }
    if (state.metric === "similarity" && state.selectedCode) loadSimilarity(state.year, state.selectedCode);
    updateColors(paths, numToIso);
    updateHatch(hatchPaths, numToIso);
    updateStats();
    updateUIForMetric();
  });

  d3.select("#metric-select").on("change", function() {
    state.metric = this.value;
    if (state.metric === "similarity" && state.selectedCode) {
      loadSimilarity(state.year, state.selectedCode);
    }
    updateUIForMetric();
    updateColors(paths, numToIso);
    updateHatch(hatchPaths, numToIso);
    updateStats();
  });

  d3.select("#topic-select").on("change", function() {
    state.topic = this.value;
    const notice = document.getElementById("topic-notice");
    if (state.topic === "all") {
      notice.textContent = "Showing: All topics";
      notice.style.color = "#4a9eff";
      notice.style.display = "block";
    } else {
      loadTopicConsensus(state.year, state.topic);
    }
    if (state.metric === "similarity" && state.selectedCode) {
      loadSimilarity(state.year, state.selectedCode);
    }
    updateColors(paths, numToIso);
    updateHatch(hatchPaths, numToIso);
    updateStats();
    updateUIForMetric();
  });

  window.addEventListener("resize", () => {
    const w = svg.node().clientWidth;
    const h = svg.node().clientHeight;
    projection.scale(w / 6.4).translate([w / 2, h / 2]);
    g.selectAll(".country-path").attr("d", path);
    g.select(".sphere").attr("d", path);
    g.select(".graticule").attr("d", path);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────────────────────────

(async () => {
  try {
    const world = await loadData();
    document.getElementById("loading").style.display = "none";

    if (world) {
      initMap(world);
    } else {
      document.querySelector(".map-area").innerHTML =
        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#3d5478;font-size:12px;letter-spacing:0.1em;">
          MAP REQUIRES INTERNET CONNECTION TO LOAD WORLD TOPOLOGY<br>
          Run from a local server with internet access.
         </div>`;
    }

    updateStats();
  } catch (err) {
    console.error("Boot error:", err);
    document.getElementById("loading-text").textContent = "Error loading data";
    document.getElementById("loading-progress").textContent = err.message;
  }

  updateUIForMetric();
})();
</script>
