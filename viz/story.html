<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Story — Who Votes With Whom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Lora:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="story.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
</head>
<body>

<div class="dna-tooltip" id="dna-tooltip"></div>
<div id="dot-tooltip" style="position:fixed;background:#1a1a2e;color:#e8eef8;
  font-family:'Outfit',sans-serif;font-size:11px;padding:5px 10px;border-radius:4px;
  pointer-events:none;opacity:0;transition:opacity 0.1s;z-index:300;white-space:nowrap;"></div>

<nav>
  <div style="display:flex;align-items:baseline">
    <span class="nav-brand">Who Votes With Whom</span>
    <span class="nav-sub">UN General Assembly · 1946–2025</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="country-tab">Country..</button>
    <a class="nav-tab" href="map.html">World Map</a>
    <a class="nav-tab" href="compare.html">Compare</a>
  </div>
</nav>

<div id="page-loading">
  <div class="loading-text" id="loading-text">Loading database</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-progress" id="loading-progress"></div>
</div>

<div class="story-wrap" id="story-wrap" style="display:none">
  <!-- Left column — primary country -->
  <div class="story-col" id="story-left-col">
    <div id="story-left"></div>
  </div>

  <!-- Right column — comparison country -->
  <div class="story-col" id="story-right-col" style="display:none">
    <div class="story-col-header">
      <span id="compare-label">Comparing</span>
      <button class="story-col-close" id="close-compare" title="Close comparison">✕</button>
    </div>
    <div id="story-right"></div>
  </div>
</div>

<script type="module">
import {
  DATA_PATHS, BLOCS, BLOC_COLORS, BLOC_LABELS, DEFUNCT, colorScale,
  DB, loadDatabase, query,
  getCountryName, getIso2, flagImg, ordinal, blocBadges,
  renderDNA,
} from "./utils.js";

// ─────────────────────────────────────────────────────────────────────────────
//  URL params
// ─────────────────────────────────────────────────────────────────────────────

const params      = new URLSearchParams(window.location.search);
const PRIMARY     = params.get("code")?.toUpperCase()    ?? null;
const COMPARE_CODE = params.get("compare")?.toUpperCase() ?? null;

// Per-country vote cache
const votesCache = new Map(); // code -> allVotes array

async function getVotes(code) {
  if (votesCache.has(code)) return votesCache.get(code);
  const raw = await d3.csv(DATA_PATHS.unclean);
  // Cache all rows under __all__ for co-voter lookups
  votesCache.set("__all__", raw);
  // Cache per-country
  const byCode = new Map();
  raw.forEach(r => {
    if (!byCode.has(r.ms_code)) byCode.set(r.ms_code, []);
    byCode.get(r.ms_code).push(r);
  });
  byCode.forEach((v, k) => votesCache.set(k, v));
  return votesCache.get(code) ?? [];
}

// ─────────────────────────────────────────────────────────────────────────────
//  Compare panel
// ─────────────────────────────────────────────────────────────────────────────

function openCompare(code) {
  if (code === PRIMARY) return;
  const url = new URL(window.location);
  url.searchParams.set("compare", code);
  window.history.pushState({}, "", url);
  renderCompare(code);
}

async function renderCompare(code) {
  const rightCol = document.getElementById("story-right-col");
  const rightDiv = document.getElementById("story-right");
  const label    = document.getElementById("compare-label");

  rightCol.style.display       = "flex";
  rightCol.style.flexDirection = "column";
  rightDiv.innerHTML = `<div style="padding:40px;"><div class="chapter-loading">Loading ${code}</div></div>`;
  label.textContent  = `Comparing · ${code}`;

  const votes = await getVotes(code);
  rightDiv.innerHTML = "";
  buildStory(code, votes, "story-right");

  const name = getCountryName(code);
  label.textContent = name;
  document.getElementById("country-tab").textContent = `${getCountryName(PRIMARY)} vs ${name}`;

  // Use ResizeObserver to render charts only once the column has real dimensions
  const dnaEl = document.getElementById("dna-svg-right");
  if (!dnaEl) return;

  const observer = new ResizeObserver((entries) => {
    for (const entry of entries) {
      if (entry.contentRect.width > 0) {
        observer.disconnect();
        renderDNA(code, "dna-svg-right");
        renderDotPlot(code, "dotplot-svg-right");
        renderIdealpointChart(code, "idealpoint-svg-right");
      }
    }
  });
  observer.observe(dnaEl);
}

function closeCompare() {
  document.getElementById("story-right-col").style.display = "none";
  document.getElementById("story-right").innerHTML = "";
  const url = new URL(window.location);
  url.searchParams.delete("compare");
  window.history.pushState({}, "", url);
  document.getElementById("country-tab").textContent = getCountryName(PRIMARY);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────────────────────────────────────

function makeChapter(num, insightHtml, visualHtml, labelText, suffix = "") {
  return `
    <div class="chapter" data-chapter="${num}${suffix}">
      <div class="ch-num">— ${String(num).padStart(2,"0")}</div>
      <div class="ch-insight">${insightHtml}</div>
      <div class="ch-visual">
        <div class="ch-visual-label">${labelText}</div>
        ${visualHtml}
      </div>
      <div class="ch-scroll-cue">↓ scroll</div>
    </div>`;
}

// Country link — opens in compare panel instead of navigating
function countryLink(code, labelHtml) {
  return `<span class="country-link" onclick="window.openCompare('${code}')">${labelHtml}</span>`;
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 1 — Profile + DNA stripe
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter1(code, votes, suffix) {
  const totalVotes  = votes.length;
  const partRow     = query("SELECT participation_rate, years_active FROM country_participation WHERE ms_code = ?", [code])[0];
  const globalAvg   = query("SELECT avg_rate FROM global_participation")[0]?.avg_rate ?? 0.7;
  const partRate    = partRow?.participation_rate ?? null;
  const yearsActive = partRow?.years_active ?? null;
  const allRates    = query("SELECT participation_rate FROM country_participation ORDER BY participation_rate");
  const rank        = allRates.findIndex(r => r.participation_rate >= partRate);
  const pctRank     = rank / allRates.length;

  const partLabel = pctRank >= 0.9  ? "one of the most active participants"
                  : pctRank >= 0.75 ? "a consistent presence"
                  : pctRank >= 0.35 ? "a reliable participant"
                  : pctRank >= 0.1  ? "a relatively quiet voice"
                  :                   "one of the least active participants";

  const country     = query("SELECT country_name, first_year, iso2 FROM countries WHERE ms_code = ?", [code])[0];
  const yearsClause = yearsActive && yearsActive < 20
    ? ` during its <span class="hl">${yearsActive} years</span> of membership` : "";

  // Vote breakdown
  const yesVotes = votes.filter(r => r.ms_vote === "Y").length;
  const absVotes = votes.filter(r => r.ms_vote === "A").length;
  const yesPct   = totalVotes ? ((yesVotes / totalVotes) * 100).toFixed(1) : "—";
  const absPct   = totalVotes ? ((absVotes / totalVotes) * 100).toFixed(1) : "—";
  const partPct  = partRate  ? (partRate * 100).toFixed(1) : "—";

  const absRaw   = totalVotes ? (absVotes / totalVotes) * 100 : 0;
  const absLabel = absRaw >= 30  ? "notably cautious — abstaining on nearly 1 in 3 votes"
                 : absRaw >  25  ? "notably cautious — abstaining on more than 1 in 4 votes"
                 : absRaw === 25 ? "notably cautious — abstaining on exactly 1 in 4 votes"
                 : absRaw >= 15  ? "moderately cautious, abstaining frequently"
                 : absRaw >= 8   ? "selective in its abstentions"
                 :                 "rarely abstaining";

  const yesAllRows = query(
    "SELECT ms_code, AVG(consensus) as avg FROM mat_consensus_overall GROUP BY ms_code ORDER BY avg"
  );
  const yesRank   = yesAllRows.findIndex(r => r.ms_code === code) + 1;
  const yesPctile = Math.round((yesRank / yesAllRows.length) * 100);
  const yesLabel  = yesPctile >= 90 ? `making it <span class="hl-green">one of the most supportive voices</span> in the assembly`
                  : yesPctile >= 75 ? `making it <span class="hl-green">a broadly supportive voice</span> in the assembly`
                  : yesPctile >= 50 ? `placing it <span class="hl">around the global median</span>`
                  : yesPctile >= 30 ? `making it <span class="hl">a selective voter</span>`
                  : `making it <span class="hl-red">one of the less agreeable voices</span> in the assembly`;

  const insight = `
    ${flagImg(country.iso2, country.country_name, 36, 27)}
    <span style="margin-left:10px;">
      Since joining the UN in <span class="hl">${country.first_year}</span>,
      <span class="hl">${country.country_name}</span> has been ${partLabel}
      in the General Assembly — participating in
      <span class="hl">${partPct}%</span> of votes${yearsClause}.
      Of the <span class="hl">${totalVotes.toLocaleString()}</span> resolutions
      it has weighed in on, it cast a <span class="hl-green">Yes</span> vote
      <span class="hl">${yesPct}%</span> of the time — ${yesLabel}.
      It is also <span class="hl">${absLabel}</span>
      (<span class="hl">${absPct}%</span> abstention rate).
    </span>`;

  return makeChapter(1, insight,
    `<svg id="dna-svg${suffix}" height="55"></svg>`,
    "Agreement with majority vote · all years", suffix);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 2 — Overall alignment + dot plot
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter2(code, suffix) {
  const cons     = query("SELECT ROUND(AVG(consensus),4) as avg FROM mat_consensus_overall WHERE ms_code = ?", [code])[0].avg;
  const allCons  = query("SELECT ms_code, AVG(consensus) as avg FROM mat_consensus_overall GROUP BY ms_code ORDER BY avg");
  const rank     = allCons.findIndex(r => r.ms_code === code) + 1;
  const pctBelow = Math.round((rank / allCons.length) * 100);
  const country  = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];

  const isEUMember   = BLOCS.EU.includes(code);
  const euCodes      = BLOCS.EU.map(c => `'${c}'`).join(",");
  const compareAvg   = isEUMember
    ? query(`SELECT ROUND(AVG(consensus),4) as avg FROM mat_consensus_overall WHERE ms_code IN (${euCodes})`)[0].avg
    : query("SELECT ROUND(AVG(avg),4) as avg FROM (SELECT ms_code, AVG(consensus) as avg FROM mat_consensus_overall GROUP BY ms_code)")[0].avg;
  const compareLabel = isEUMember ? "EU" : "global";
  const direction    = cons > compareAvg ? "above" : "below";
  const diff         = Math.abs(((cons - compareAvg) * 100)).toFixed(1);
  const hlClass      = cons > compareAvg ? "hl-green" : "hl-red";

  const alignedPhrase = pctBelow >= 50
    ? `more aligned than <span class="hl">${pctBelow}%</span> of all member states`
    : `less aligned than <span class="hl">${100 - pctBelow}%</span> of all member states`;

  const insight = `
    Overall, <span class="hl">${country.country_name}</span> agrees with the majority vote
    <span class="hl">${(cons * 100).toFixed(1)}%</span> of the time —
    ${alignedPhrase}.
    That is <span class="${hlClass}">${diff} points ${direction}</span> the ${compareLabel} average.`;

  return { html: makeChapter(2, insight,
    `<svg id="dotplot-svg${suffix}"></svg>`,
    "Average agreement score · all member states — click any dot to explore", suffix),
    cons, allCons };
}

function renderDotPlot(code, svgId) {
  const cons    = query("SELECT ROUND(AVG(consensus),4) as avg FROM mat_consensus_overall WHERE ms_code = ?", [code])[0]?.avg;
  const allCons = query("SELECT ms_code, AVG(consensus) as avg FROM mat_consensus_overall GROUP BY ms_code ORDER BY avg");
  if (!cons || !allCons.length) return;

  const activeBlocs  = new Set(Object.keys(BLOC_COLORS));
  const countryBlocs = new Map();
  for (const [bloc, codes] of Object.entries(BLOCS)) {
    codes.forEach(c => {
      if (!countryBlocs.has(c)) countryBlocs.set(c, []);
      countryBlocs.get(c).push(bloc);
    });
  }
  const blocPriority = ["EU","NATO","BRICS","PfP","OIC","African Group","CELAC","ASEAN"];
  const dotTooltip   = document.getElementById("dot-tooltip");
  const svgEl        = document.getElementById(svgId);
  if (!svgEl) return;

  const container = svgEl.parentNode;
  const legendId  = `legend-${svgId}`;
  container.innerHTML = `
    <svg id="${svgId}" style="width:100%;height:80px;display:block;"></svg>
    <div id="${legendId}" style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;align-items:center;"></div>`;

  const svgNode = document.getElementById(svgId);
  if (!svgNode) return;
  svgNode.style.width = "100%";
  const w   = Math.max(100, svgNode.parentElement?.clientWidth || svgNode.parentElement?.offsetWidth || 600);
  const svg = d3.select(`#${svgId}`);
  svg.attr("viewBox", `0 0 ${w} 80`);

  const x = d3.scaleLinear()
    .domain([d3.min(allCons, d => d.avg), d3.max(allCons, d => d.avg)])
    .range([20, w - 20]);

  svg.append("rect").attr("x",20).attr("y",28).attr("width",w-40).attr("height",4)
    .attr("fill","#e0dbd0").attr("rx",2);

  const dots = svg.selectAll("circle.dot")
    .data(allCons.filter(d => d.ms_code !== code))
    .join("circle").attr("class","dot")
    .attr("cx", d => x(d.avg)).attr("cy",30).attr("r",5.5)
    .attr("fill", d => {
      const b = countryBlocs.get(d.ms_code);
      if (!b?.length) return BLOC_COLORS["Other"];
      for (const bloc of blocPriority) {
        if (b.includes(bloc)) return BLOC_COLORS[bloc];
      }
      return BLOC_COLORS["Other"];
    })
    .attr("opacity", 0.85)
    .attr("data-blocs", d => {
      const b = countryBlocs.get(d.ms_code);
      return b?.length ? b.join(",") : "Other";
    })
    .style("cursor","pointer")
    .on("mousemove", function(event, d) {
      dotTooltip.textContent   = `${getCountryName(d.ms_code)}  ·  ${(d.avg*100).toFixed(1)}%`;
      dotTooltip.style.opacity = "1";
      dotTooltip.style.left    = (event.clientX + 12) + "px";
      dotTooltip.style.top     = (event.clientY - 28) + "px";
    })
    .on("mouseleave", () => dotTooltip.style.opacity = "0")
    .on("click", (event, d) => window.openCompare(d.ms_code));

  const myX = x(cons);
  svg.append("line").attr("x1",myX).attr("x2",myX).attr("y1",8).attr("y2",50)
    .attr("stroke","#1a1a2e").attr("stroke-width",2);
  svg.append("circle").attr("cx",myX).attr("cy",30).attr("r",6)
    .attr("fill","#1a1a2e").attr("stroke","#fff").attr("stroke-width",2);
  svg.append("text").attr("x",myX).attr("y",6).attr("text-anchor","middle")
    .attr("font-size","10").attr("fill","#1a1a2e").attr("font-family","Outfit,sans-serif")
    .attr("font-weight","600").text(code);

  svg.append("text").attr("x",20).attr("y",68).attr("font-size","10").attr("fill","#9898b0")
    .attr("font-family","Outfit,sans-serif").text("Low agreement");
  svg.append("text").attr("x",w-20).attr("y",68).attr("text-anchor","end")
    .attr("font-size","10").attr("fill","#9898b0").attr("font-family","Outfit,sans-serif")
    .text("High agreement");

  function updateDots() {
    dots
      .attr("opacity", function() {
        const blocs = (this.getAttribute("data-blocs") ?? "Other").split(",");
        return blocs.some(b => activeBlocs.has(b)) ? 0.85 : 0;
      })
      .style("pointer-events", function() {
        const blocs = (this.getAttribute("data-blocs") ?? "Other").split(",");
        return blocs.some(b => activeBlocs.has(b)) ? "auto" : "none";
      });
  }

  // ── Colorblind-safe alternative palette (Okabe-Ito) ──────────────────────
  const CB_COLORS = {
    "EU":           "#0072B2",
    "NATO":         "#56B4E9",
    "BRICS":        "#E69F00",
    "PfP":          "#009E73",
    "OIC":          "#CC79A7",
    "African Group":"#D55E00",
    "CELAC":        "#F0E442",
    "ASEAN":        "#000000",
    "Other":        "#BBBBBB",
  };

  let cbMode = false;

  function currentColors() { return cbMode ? CB_COLORS : BLOC_COLORS; }

  function applyColors() {
    const colors = currentColors();
    // Update dots
    dots.attr("fill", d => {
      const b = countryBlocs.get(d.ms_code);
      if (!b?.length) return colors["Other"];
      for (const bloc of blocPriority) {
        if (b.includes(bloc)) return colors[bloc] ?? colors["Other"];
      }
      return colors["Other"];
    });
    // Update legend dots
    Object.keys(colors).forEach(key => {
      const el = document.getElementById(`ld-${svgId}-${key}`);
      if (el) el.style.background = colors[key];
    });
  }

  const legend = document.getElementById(legendId);
  Object.entries(BLOC_COLORS).forEach(([key, color]) => {
    const fullName    = BLOC_LABELS[key] ?? key;
    const memberCount = BLOCS[key]?.length ?? null;
    const titleText   = memberCount ? `${fullName} · ${memberCount} members` : fullName;
    const dotId       = `ld-${svgId}-${key}`;
    const labelId     = `ll-${svgId}-${key}`;
    const btn = document.createElement("button");
    btn.title     = titleText;
    btn.style.cssText = `display:inline-flex;align-items:center;gap:5px;background:none;
      border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:10px;
      color:#5a5a7a;padding:2px 0;`;
    btn.innerHTML = `
      <span id="${dotId}" style="width:10px;height:10px;border-radius:50%;
        background:${color};display:inline-block;transition:background 0.2s,opacity 0.15s;"></span>
      <span id="${labelId}">${key}</span>`;
    btn.addEventListener("click", () => {
      if (activeBlocs.has(key)) {
        activeBlocs.delete(key);
        document.getElementById(dotId).style.opacity   = "0.25";
        document.getElementById(labelId).style.opacity = "0.4";
      } else {
        activeBlocs.add(key);
        document.getElementById(dotId).style.opacity   = "1";
        document.getElementById(labelId).style.opacity = "1";
      }
      updateDots();
    });
    legend.appendChild(btn);
  });

  // Eye icon — colorblind toggle
  const eyeBtn = document.createElement("button");
  eyeBtn.id    = `cb-toggle-${svgId}`;
  eyeBtn.title = "Toggle colorblind-safe palette (Okabe-Ito)";
  eyeBtn.style.cssText = `display:inline-flex;align-items:center;gap:4px;background:none;
    border:1px solid #c8c4bc;border-radius:4px;cursor:pointer;
    font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:0.06em;
    color:#9898b0;padding:2px 7px;margin-left:6px;transition:all 0.15s;`;
  eyeBtn.innerHTML = `👁 CB`;
  eyeBtn.addEventListener("click", () => {
    cbMode = !cbMode;
    eyeBtn.style.background   = cbMode ? "#1a1a2e" : "none";
    eyeBtn.style.color        = cbMode ? "#e8eef8" : "#9898b0";
    eyeBtn.style.borderColor  = cbMode ? "#1a1a2e" : "#c8c4bc";
    applyColors();
  });
  legend.appendChild(eyeBtn);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 3a — Closest long-term partners
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter3a(code, suffix) {
  const membershipYears = query(
    "SELECT years_active FROM country_participation WHERE ms_code = ?", [code]
  )[0]?.years_active ?? 70;
  const threshold = Math.max(10, Math.round(membershipYears * 0.3));
  const country   = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];

  const closest = query(`
    SELECT CASE WHEN ms_code1 = ? THEN ms_code2 ELSE ms_code1 END AS other_code,
           ROUND(AVG(agreement), 4) AS avg_agr, COUNT(DISTINCT year) AS n_years
    FROM agreement_overall WHERE (ms_code1 = ? OR ms_code2 = ?)
    GROUP BY other_code HAVING n_years >= ${threshold} ORDER BY avg_agr DESC LIMIT 5
  `, [code, code, code]);

  if (!closest.length) return null;

  const top     = closest[0];
  const topName = getCountryName(top.other_code);
  const listId  = `ch3a-list${suffix}`;
  const btnId   = `ch3a-more${suffix}`;

  const insight = `
    <span class="hl">${country.country_name}</span>'s most enduring voting partner is
    <span class="country-link" onclick="window.openCompare('${top.other_code}')">
      <span class="hl">${topName}</span></span> — they have voted together for
    <span class="hl">${top.n_years} years</span>, agreeing
    <span class="hl-green">${(top.avg_agr * 100).toFixed(1)}%</span> of the time.`;

  function rowHtml(r, i) {
    const name = getCountryName(r.other_code);
    const iso2 = getIso2(r.other_code);
    return `
      <div class="partner-row-link" onclick="window.openCompare('${r.other_code}')">
        <div class="partner-rank">${i+1}</div>
        ${flagImg(iso2, name, 20, 15)}
        <div class="partner-name">${name}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">${blocBadges(r.other_code)}</div>
        <div class="partner-meta" style="margin-left:auto;">${r.n_years} yrs</div>
        <div class="partner-score-strong close">${(r.avg_agr*100).toFixed(1)}%</div>
      </div>`;
  }

  const labelHtml = `
    <span class="threshold-info">
      Longest-running partnerships · min ${threshold} years
      <span class="info-icon">i</span>
      <span class="info-tooltip">Threshold = 30% of ${country.country_name}'s ${membershipYears} years of membership</span>
    </span>`;

  const visual = `
    <div id="${listId}">${closest.map((r,i) => rowHtml(r,i)).join("")}</div>
    <button class="show-more-btn" id="${btnId}">Show more</button>`;

  return { html: makeChapter(3, insight, visual, labelHtml, suffix), threshold };
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 3b — Most distant long-term partners
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter3b(code, suffix, threshold) {
  const country = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];

  const distant = query(`
    SELECT CASE WHEN ms_code1 = ? THEN ms_code2 ELSE ms_code1 END AS other_code,
           ROUND(AVG(agreement), 4) AS avg_agr, COUNT(DISTINCT year) AS n_years
    FROM agreement_overall WHERE (ms_code1 = ? OR ms_code2 = ?)
    GROUP BY other_code HAVING n_years >= ${threshold} ORDER BY avg_agr ASC LIMIT 5
  `, [code, code, code]);

  if (!distant.length) return null;

  const bot     = distant[0];
  const botName = getCountryName(bot.other_code);
  const distId  = `ch3b-list${suffix}`;
  const distBtnId = `ch3b-more${suffix}`;

  const insight = `
    <span class="hl">${country.country_name}</span> also has a long-running divergence with
    <span class="country-link" onclick="window.openCompare('${bot.other_code}')">
      <span class="hl-red">${botName}</span></span> — ${bot.n_years} years of shared votes,
    agreeing only <span class="hl-red">${(bot.avg_agr * 100).toFixed(1)}%</span> of the time.`;

  function rowHtml(r, i) {
    const name = getCountryName(r.other_code);
    const iso2 = getIso2(r.other_code);
    return `
      <div class="partner-row-link" onclick="window.openCompare('${r.other_code}')">
        <div class="partner-rank">${i+1}</div>
        ${flagImg(iso2, name, 20, 15)}
        <div class="partner-name">${name}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">${blocBadges(r.other_code)}</div>
        <div class="partner-meta" style="margin-left:auto;">${r.n_years} yrs</div>
        <div class="partner-score-strong distant">${(r.avg_agr*100).toFixed(1)}%</div>
      </div>`;
  }

  const visual = `
    <div id="${distId}">${distant.map((r,i) => rowHtml(r,i)).join("")}</div>
    <button class="show-more-btn" id="${distBtnId}">Show more</button>`;

  return { html: makeChapter(4, insight, visual, `Most distant partnerships · min ${threshold} years`, suffix) };
}

function initShowMore(code, listId, btnId, suffix, order = "DESC") {
  const threshold = Math.max(10, Math.round(
    (query("SELECT years_active FROM country_participation WHERE ms_code = ?", [code])[0]?.years_active ?? 70) * 0.3
  ));
  const btn = document.getElementById(btnId);
  if (!btn) return;
  let offset = 5, showing = 5;

  btn.addEventListener("click", () => {
    if (showing > 5) {
      document.getElementById(listId).querySelectorAll(".partner-row-link").forEach((r, i) => {
        if (i >= 5) r.remove();
      });
      offset = 5; showing = 5;
      btn.textContent = "Show more";
      return;
    }
    const more = query(`
      SELECT CASE WHEN ms_code1 = ? THEN ms_code2 ELSE ms_code1 END AS other_code,
             ROUND(AVG(agreement), 4) AS avg_agr, COUNT(DISTINCT year) AS n_years
      FROM agreement_overall WHERE (ms_code1 = ? OR ms_code2 = ?)
      GROUP BY other_code HAVING n_years >= ${threshold} ORDER BY avg_agr ${order}
      LIMIT 10 OFFSET ?
    `, [code, code, code, offset]);

    const list = document.getElementById(listId);
    const type = order === "DESC" ? "close" : "distant";
    more.forEach((r, i) => {
      const name = getCountryName(r.other_code);
      const iso2 = getIso2(r.other_code);
      const div  = document.createElement("div");
      div.className = "partner-row-link";
      div.onclick   = () => window.openCompare(r.other_code);
      div.innerHTML = `
        <div class="partner-rank">${offset + i + 1}</div>
        ${flagImg(iso2, name, 20, 15)}
        <div class="partner-name">${name}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">${blocBadges(r.other_code)}</div>
        <div class="partner-meta" style="margin-left:auto;">${r.n_years} yrs</div>
        <div class="partner-score-strong ${type}">${(r.avg_agr*100).toFixed(1)}%</div>`;
      list.appendChild(div);
    });
    offset  += more.length;
    showing += more.length;
    if (more.length === 0) btn.style.display = "none";
    else btn.textContent = "Show less";
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 4 — Emerging & drifting
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter4(code, suffix) {
  const country = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];
  const shifts  = query(`
    SELECT CASE WHEN ms_code1 = ? THEN ms_code2 ELSE ms_code1 END AS other_code,
           ROUND(AVG(CASE WHEN year < 2000 THEN agreement END), 4) AS pre2000,
           ROUND(AVG(CASE WHEN year >= 2000 THEN agreement END), 4) AS post2000,
           COUNT(CASE WHEN year < 2000 THEN 1 END) AS n_pre,
           COUNT(CASE WHEN year >= 2000 THEN 1 END) AS n_post
    FROM agreement_overall WHERE (ms_code1 = ? OR ms_code2 = ?)
    GROUP BY other_code HAVING n_pre >= 5 AND n_post >= 5
      AND pre2000 IS NOT NULL AND post2000 IS NOT NULL
  `, [code, code, code]);

  shifts.forEach(r => r.delta = r.post2000 - r.pre2000);

  const top5emerging = shifts.filter(r => r.delta > 0).sort((a,b) => b.delta - a.delta).slice(0,5);
  const top5drifting = shifts.filter(r => r.delta < 0).sort((a,b) => a.delta - b.delta).slice(0,5);

  if (!top5emerging.length || !top5drifting.length) return null;

  const emerging     = top5emerging[0];
  const drifting     = top5drifting[0];
  const emergingName = getCountryName(emerging.other_code);
  const driftingName = getCountryName(drifting.other_code);

  const insight = `
    Since 2000, <span class="country-link" onclick="window.openCompare('${emerging.other_code}')">
      <span class="hl-green">${emergingName}</span></span> has become a closer partner —
    agreement rose from <span class="hl">${(emerging.pre2000*100).toFixed(1)}%</span> to
    <span class="hl-green">${(emerging.post2000*100).toFixed(1)}%</span>.
    Meanwhile agreement with <span class="country-link" onclick="window.openCompare('${drifting.other_code}')">
      <span class="hl-red">${driftingName}</span></span> has fallen from
    <span class="hl">${(drifting.pre2000*100).toFixed(1)}%</span> to
    <span class="hl-red">${(drifting.post2000*100).toFixed(1)}%</span>.`;

  function hoverList(list, type) {
    return list.map((r, i) => {
      const name  = getCountryName(r.other_code);
      const iso2  = getIso2(r.other_code);
      const delta = (Math.abs(r.delta) * 100).toFixed(1);
      const sign  = type === "up" ? "+" : "−";
      return `
        <div class="shift-hover-row" onclick="window.openCompare('${r.other_code}')">
          <div class="shift-hover-rank">${i+1}</div>
          ${flagImg(iso2, name, 16, 12)}
          <div class="shift-hover-name">${name}</div>
          <div style="display:flex;gap:3px;">${blocBadges(r.other_code)}</div>
          <div class="shift-hover-delta ${type === 'up' ? 'pos' : 'neg'}">${sign}${delta} pts</div>
        </div>`;
    }).join("");
  }

  function shiftCard(r, name, type, top5) {
    const iso2  = getIso2(r.other_code);
    const delta = (Math.abs(r.delta) * 100).toFixed(1);
    const cls   = type === "up" ? "emerging" : "drifting";
    return `
      <div class="shift-card ${cls}">
        <div class="shift-card-arrow">${type === "up" ? "↑" : "↓"}</div>
        <div class="shift-card-name">${flagImg(iso2, name, 20, 15)} ${name}</div>
        <div class="shift-card-delta">${type === "up" ? "+" : "−"}${delta} pts</div>
        <div class="shift-card-hint">↓ hover for top 5</div>
        <div class="shift-hover-list">${hoverList(top5, type)}</div>
      </div>`;
  }

  return makeChapter(4,
    insight,
    `<div class="shift-cards">
      ${shiftCard(emerging, emergingName, "up",   top5emerging)}
      ${shiftCard(drifting, driftingName, "down", top5drifting)}
    </div>`,
    "Change in average agreement before vs after 2000", suffix);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 5 — Topic breakdown (stacked bars)
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter5(code, votes, suffix) {
  const country = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];

  const globalMedians = query(`
    SELECT category_name, ROUND(AVG(consensus),4) AS global_avg
    FROM mat_consensus_by_category GROUP BY category_name
  `);
  const medianMap = new Map(globalMedians.map(r => [r.category_name, r.global_avg]));

  const topicVotes = {};
  votes.forEach(r => {
    const cat = r.subject_category;
    if (!cat || cat === "Uncategorized" || cat === "Other") return;
    if (!topicVotes[cat]) topicVotes[cat] = { Y:0, N:0, A:0, total:0 };
    if (r.ms_vote === "Y") topicVotes[cat].Y++;
    else if (r.ms_vote === "N") topicVotes[cat].N++;
    else if (r.ms_vote === "A") topicVotes[cat].A++;
    topicVotes[cat].total++;
  });

  const rows = Object.entries(topicVotes)
    .filter(([, v]) => v.total >= 5)
    .map(([cat, v]) => ({
      category_name: cat,
      yesPct: v.Y / v.total,
      noPct:  v.N / v.total,
      absPct: v.A / v.total,
      total:  v.total,
      delta:  (v.Y / v.total) - (medianMap.get(cat) ?? 0.7),
    }))
    .sort((a,b) => b.yesPct - a.yesPct);

  if (!rows.length) return null;

  const best     = rows[0];
  const worst    = rows[rows.length - 1];
  const allBelow = rows.every(r => r.delta < 0);

  let insight;
  if (allBelow) {
    insight = `
      <span class="hl">${country.country_name}</span> diverges from the global consensus
      across all topics — coming closest on
      <span class="hl">${best.category_name}</span>
      (<span class="hl-red">${(best.delta*100).toFixed(1)} pts</span> below average),
      and most sharply on
      <span class="hl">${worst.category_name}</span>
      (<span class="hl-red">${(worst.delta*100).toFixed(1)} pts</span> below average).`;
  } else {
    const bestAbove  = best.delta > 0;
    const worstBelow = worst.delta < 0;
    insight = `
      <span class="hl">${country.country_name}</span> votes Yes most often on
      <span class="hl">${best.category_name}</span>
      (<span class="hl-green">${(best.yesPct*100).toFixed(1)}%</span>
      <span class="${bestAbove ? 'hl-green' : 'hl-red'}">${bestAbove ? '+' : ''}${(best.delta*100).toFixed(1)} pts vs avg</span>),
      and least often on
      <span class="hl">${worst.category_name}</span>
      (<span class="hl-red">${(worst.yesPct*100).toFixed(1)}%</span>
      <span class="${worstBelow ? 'hl-red' : 'hl-green'}">${worstBelow ? '' : '+'}${(worst.delta*100).toFixed(1)} pts vs avg</span>).`;
  }

  const YES_COLOR = "#0072B2";   // blue
  const ABS_COLOR = "#F5E6C8";   // light beige
  const NO_COLOR  = "#D55E00";   // dark orange

  const listHtml = rows.map(r => {
    const yW = (r.yesPct * 100);
    const aW = (r.absPct * 100);
    const nW = (r.noPct  * 100);
    const dStr = (r.delta >= 0 ? "+" : "") + (r.delta * 100).toFixed(1);
    const yLabel = yW >= 8 ? `<span style="position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:8px;color:rgba(255,255,255,0.9);font-family:'Outfit',sans-serif;white-space:nowrap;">${yW.toFixed(0)}%</span>` : "";
    const aLabel = aW >= 8 ? `<span style="position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:8px;color:#5a5a7a;font-family:'Outfit',sans-serif;white-space:nowrap;">${aW.toFixed(0)}%</span>` : "";
    const nLabel = nW >= 8 ? `<span style="position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:8px;color:rgba(255,255,255,0.9);font-family:'Outfit',sans-serif;white-space:nowrap;">${nW.toFixed(0)}%</span>` : "";
    return `
      <div class="topic-row" style="margin-bottom:6px;">
        <div class="topic-label">${r.category_name}</div>
        <div class="topic-bars-wrap" style="height:18px;position:relative;border-radius:4px;overflow:hidden;background:#e8e4dc;">
          <div style="position:absolute;left:0;top:0;height:100%;width:${yW.toFixed(1)}%;background:${YES_COLOR};opacity:0.9;display:flex;align-items:center;">${yLabel}</div>
          <div style="position:absolute;left:${yW.toFixed(1)}%;top:0;height:100%;width:${aW.toFixed(1)}%;background:${ABS_COLOR};border-left:1px solid #ccc;display:flex;align-items:center;">${aLabel}</div>
          <div style="position:absolute;left:${(yW+aW).toFixed(1)}%;top:0;height:100%;width:${nW.toFixed(1)}%;background:${NO_COLOR};opacity:0.9;display:flex;align-items:center;">${nLabel}</div>
        </div>
        <div class="topic-delta ${r.delta >= 0 ? 'pos' : 'neg'}" title="vs global median">${dStr}</div>
      </div>`;
  }).join("");

  const visual = `
    <div style="display:flex;justify-content:flex-end;gap:16px;margin-bottom:10px;
      font-size:9px;color:var(--text-3);letter-spacing:0.08em;">
      <span style="color:${YES_COLOR};">■ Yes</span>
      <span style="color:#a89060;">■ Abstain</span>
      <span style="color:${NO_COLOR};">■ No</span>
      <span style="width:44px;text-align:right;">vs avg</span>
    </div>
    <div class="topic-list">${listHtml}</div>`;

  return { html: makeChapter(5, insight, visual, "Voting breakdown by topic · Yes / Abstain / No", suffix), rows };
}

function renderArcChart(code, svgId) {
  const myTopics = query(`
    SELECT category_name, ROUND(AVG(consensus),4) AS avg
    FROM mat_consensus_by_category WHERE ms_code = ?
    GROUP BY category_name
  `, [code]);

  const globalMedians = query(`
    SELECT category_name, ROUND(AVG(consensus),4) AS global_avg
    FROM mat_consensus_by_category GROUP BY category_name
  `);

  const medianMap = new Map(globalMedians.map(r => [r.category_name, r.global_avg]));
  const rows = myTopics.map(r => ({
    ...r,
    delta: r.avg - (medianMap.get(r.category_name) ?? 0.7),
  })).sort((a,b) => b.delta - a.delta);

  if (!rows.length) return;

  const svgEl = document.getElementById(svgId);
  if (!svgEl) return;

  const size      = 300;
  const cx        = size / 2;
  const cy        = size / 2;
  const zeroR     = 80;  // radius representing zero delta (global average)
  const maxSpread = 50;  // max pixels above or below zero
  const n         = rows.length;
  const padAngle  = 0.05;
  const angleStep = (2 * Math.PI) / n;

  const absMax = Math.max(
    Math.abs(d3.min(rows, d => d.delta)),
    Math.abs(d3.max(rows, d => d.delta))
  );

  // Linear scale centred on zeroR: delta=0 → zeroR, positive → outward, negative → inward
  const rScale = d3.scaleLinear()
    .domain([-absMax, absMax])
    .range([zeroR - maxSpread, zeroR + maxSpread]);

  const topicColor = d3.scaleSequential()
    .domain([0, n - 1])
    .interpolator(d3.interpolateRgbBasis([
      "#1a3a6e","#2980b9","#27ae60","#f39c12","#c0392b","#9b59b6","#1abc9c","#e67e22","#1a3a6e"
    ]));

  const svg = d3.select(`#${svgId}`).attr("viewBox", `0 0 ${size} ${size}`);
  svg.selectAll("*").remove();
  svg.selectAll("*").remove();

  // Zero reference circle
  svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r", zeroR)
    .attr("fill","none").attr("stroke","#c8c4bc").attr("stroke-width",1.5);

  // Outer max ring (faint)
  svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r", zeroR + maxSpread)
    .attr("fill","none").attr("stroke","#e8e4dc").attr("stroke-width",0.6).attr("stroke-dasharray","3,3");

  // Inner min ring (faint)
  svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r", zeroR - maxSpread)
    .attr("fill","none").attr("stroke","#e8e4dc").attr("stroke-width",0.6).attr("stroke-dasharray","3,3");

  // Center labels
  svg.append("text").attr("x",cx).attr("y",cy-6).attr("text-anchor","middle")
    .attr("font-size","8").attr("fill","#9898b0").attr("font-family","Outfit,sans-serif")
    .text("← below avg");
  svg.append("text").attr("x",cx).attr("y",cy+8).attr("text-anchor","middle")
    .attr("font-size","8").attr("fill","#9898b0").attr("font-family","Outfit,sans-serif")
    .text("above avg →");

  rows.forEach((r, i) => {
    const startAngle = i * angleStep - Math.PI / 2;
    const endAngle   = startAngle + angleStep - padAngle;
    const outerR     = rScale(r.delta);

    // For positive delta: arc from zeroR outward
    // For negative delta: arc from outerR to zeroR (inverted)
    const innerR = r.delta >= 0 ? zeroR : outerR;
    const outer  = r.delta >= 0 ? outerR : zeroR;

    if (Math.abs(outer - innerR) < 1) return; // skip if too small

    const arc = d3.arc()
      .innerRadius(Math.min(innerR, outer))
      .outerRadius(Math.max(innerR, outer))
      .startAngle(startAngle)
      .endAngle(endAngle);

    svg.append("path")
      .attr("d", arc())
      .attr("transform", `translate(${cx},${cy})`)
      .attr("fill", topicColor(i))
      .attr("opacity", r.delta >= 0 ? 0.85 : 0.6)
      .append("title").text(`${r.category_name}: ${(r.avg*100).toFixed(1)}% (${r.delta >= 0 ? '+' : ''}${(r.delta*100).toFixed(1)} vs avg)`);

    // Label — place at outer edge
    const midAngle = (startAngle + endAngle) / 2;
    const labelR   = Math.max(innerR, outer) + 14;
    const lx = cx + Math.cos(midAngle) * labelR;
    const ly = cy + Math.sin(midAngle) * labelR;

    svg.append("text")
      .attr("x", lx).attr("y", ly)
      .attr("text-anchor", lx < cx - 5 ? "end" : lx > cx + 5 ? "start" : "middle")
      .attr("dominant-baseline", "middle")
      .attr("font-size", "7.5")
      .attr("fill", "#5a5a7a")
      .attr("font-family", "Outfit,sans-serif")
      .text(r.category_name.split(/[\s&,]+/).slice(0,2).join(" "));
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 6 — Bloc alignment
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter6(code, suffix) {
  const country = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];

  const memberBlocs = Object.entries(BLOCS)
    .filter(([, codes]) => codes.includes(code))
    .map(([name]) => name);

  const blocScores = {};
  for (const [bloc, codes] of Object.entries(BLOCS)) {
    const members = codes.filter(c => c !== code);
    if (!members.length) continue;
    const placeholders = members.map(() => "?").join(",");
    const rows = query(`
      SELECT ROUND(AVG(agreement), 4) AS avg FROM agreement_overall
      WHERE (ms_code1 = ? OR ms_code2 = ?)
        AND (CASE WHEN ms_code1 = ? THEN ms_code2 ELSE ms_code1 END) IN (${placeholders})
    `, [code, code, code, ...members]);
    blocScores[bloc] = rows[0]?.avg ?? null;
  }

  const sorted = Object.entries(blocScores)
    .filter(([, v]) => v !== null)
    .sort((a, b) => b[1] - a[1]);

  if (!sorted.length) return null;

  const topBloc  = sorted[0][0];
  const topScore = sorted[0][1];

  const formalBlocs  = ["EU","NATO","BRICS","PfP"];
  const topIsFormal  = formalBlocs.includes(topBloc);
  const memberFormal = memberBlocs.filter(b => formalBlocs.includes(b));

  let insight;
  if (memberBlocs.length === 0) {
    insight = `
      Without formal bloc membership, <span class="hl">${country.country_name}</span>
      votes most similarly to the <span class="hl">${topBloc}</span>
      (<span class="hl">${(topScore*100).toFixed(1)}%</span> average agreement).`;
  } else if (memberBlocs.includes(topBloc)) {
    const prefix = topIsFormal ? "Consistent with its membership" : "Consistent with its status";
    insight = `
      ${prefix}, <span class="hl">${country.country_name}</span>
      votes most similarly to fellow <span class="hl">${topBloc}</span> members
      (<span class="hl">${(topScore*100).toFixed(1)}%</span>).`;
  } else {
    const memberScore = blocScores[memberBlocs[0]];
    const memberRank  = sorted.findIndex(([b]) => b === memberBlocs[0]) + 1;
    const prefix      = memberFormal.length ? "Despite being a member of" : "Despite its status as a";
    insight = `
      ${prefix} <span class="hl">${memberBlocs.join(" and ")}</span>${memberFormal.length ? "" : " nation"},
      <span class="hl">${country.country_name}</span> votes most similarly to
      the <span class="hl">${topBloc}</span>
      (<span class="hl">${(topScore*100).toFixed(1)}%</span>) —
      a bloc it does not formally belong to.
      Its closest formal alliance ranks
      <span class="hl">${ordinal(memberRank)}</span> at
      <span class="hl">${(memberScore*100).toFixed(1)}%</span>.`;
  }

  const barsHtml = sorted.map(([bloc, score]) => {
    const isMember   = memberBlocs.includes(bloc);
    const color      = BLOC_COLORS[bloc] ?? "#888";
    const barW       = Math.max(0, ((score - 0.4) / 0.6 * 100)).toFixed(1);
    const fullName   = BLOC_LABELS[bloc] ?? bloc;
    const memberCount = BLOCS[bloc]?.length ?? null;
    const titleText  = memberCount ? `${fullName} · ${memberCount} members` : fullName;
    return `
      <div class="bloc-bar-row">
        <div class="bloc-bar-label" title="${titleText}" style="cursor:help;">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;
            background:${color};flex-shrink:0;"></span>
          ${bloc}
          ${isMember ? `<span class="bloc-member-badge">member</span>` : ""}
        </div>
        <div class="bloc-bar-wrap">
          <div class="bloc-bar-fill" style="width:${barW}%;background:${color};"></div>
        </div>
        <div class="bloc-bar-score">${(score*100).toFixed(1)}%</div>
      </div>`;
  }).join("");

  return makeChapter(6, insight,
    `<div class="bloc-bars">${barsHtml}</div>`,
    "Average pairwise agreement score with each voting bloc", suffix);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 7 — Political trajectory
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter7(code, suffix) {
  const country = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];
  const ipRows  = query("SELECT year, ideal_point FROM ideal_points WHERE ms_code = ? ORDER BY year", [code]);
  if (!ipRows.length) return null;

  const first = ipRows[0];
  const last  = ipRows[ipRows.length - 1];
  const delta = last.ideal_point - first.ideal_point;

  const direction = delta > 0.1  ? "moving closer to the Western bloc"
                  : delta < -0.1 ? "drifting away from the Western bloc"
                  :                "remaining broadly stable";

  let maxJump = 0, maxYear = null;
  for (let i = 1; i < ipRows.length; i++) {
    const jump = Math.abs(ipRows[i].ideal_point - ipRows[i-1].ideal_point);
    if (jump > maxJump) { maxJump = jump; maxYear = ipRows[i].year; }
  }

  const hlClass = delta > 0.1 ? "hl-green" : delta < -0.1 ? "hl-red" : "hl";

  const insight = `
    <span class="hl">${country.country_name}</span>'s political position has shifted from
    <span class="hl">${first.ideal_point.toFixed(2)}</span> in <span class="hl">${first.year}</span>
    to <span class="${hlClass}">${last.ideal_point.toFixed(2)}</span> in <span class="hl">${last.year}</span> —
    ${direction} over time.
    The largest single-year shift occurred in <span class="hl">${maxYear}</span>.`;

  return { html: makeChapter(7, insight,
    `<svg id="idealpoint-svg${suffix}"></svg>`,
    "Ideal point estimate · higher = more Western-aligned", suffix), ipRows, maxYear };
}

function renderIdealpointChart(code, svgId) {
  const ipRows = query(
    "SELECT year, ideal_point, q5, q95 FROM ideal_points WHERE ms_code = ? ORDER BY year", [code]
  );
  if (!ipRows.length) return;
  const svgEl = document.getElementById(svgId);
  if (!svgEl) return;

  let maxJump = 0, maxYear = null;
  for (let i = 1; i < ipRows.length; i++) {
    const jump = Math.abs(ipRows[i].ideal_point - ipRows[i-1].ideal_point);
    if (jump > maxJump) { maxJump = jump; maxYear = ipRows[i].year; }
  }

  const svg    = d3.select(`#${svgId}`);
  const svgN   = svg.node();
  svgN.style.width = "100%";
  const w      = Math.max(100, svgN.parentElement?.clientWidth || svgN.parentElement?.offsetWidth || 600);
  const h      = 200;
  const margin = { top: 16, right: 16, bottom: 28, left: 40 };
  const iw     = w - margin.left - margin.right;
  const ih     = h - margin.top  - margin.bottom;

  svg.attr("viewBox", `0 0 ${w} ${h}`);
  svg.selectAll("*").remove();
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleLinear().domain(d3.extent(ipRows, d => d.year)).range([0, iw]);
  const y = d3.scaleLinear()
    .domain([
      d3.min(ipRows, d => d.q5 ?? d.ideal_point) - 0.2,
      d3.max(ipRows, d => d.q95 ?? d.ideal_point) + 0.2
    ])
    .range([ih, 0]);

  // Zero line
  g.append("line").attr("x1",0).attr("x2",iw).attr("y1",y(0)).attr("y2",y(0))
    .attr("stroke","#e0dbd0").attr("stroke-width",1).attr("stroke-dasharray","4,4");

  // Confidence band (Q5–Q95)
  const hasConfidence = ipRows.some(d => d.q5 != null && d.q95 != null);
  if (hasConfidence) {
    g.append("path").datum(ipRows)
      .attr("fill","#1a4a80").attr("opacity",0.15)
      .attr("d", d3.area()
        .x(d => x(d.year))
        .y0(d => y(d.q5 ?? d.ideal_point))
        .y1(d => y(d.q95 ?? d.ideal_point))
        .curve(d3.curveMonotoneX));
  }

  // Area fill under line
  g.append("path").datum(ipRows)
    .attr("fill","#dce6f5").attr("opacity",0.5)
    .attr("d", d3.area()
      .x(d => x(d.year)).y0(ih).y1(d => y(d.ideal_point))
      .curve(d3.curveMonotoneX));

  // Main line
  g.append("path").datum(ipRows)
    .attr("fill","none").attr("stroke","#1a3a6e").attr("stroke-width",2)
    .attr("d", d3.line()
      .x(d => x(d.year)).y(d => y(d.ideal_point))
      .curve(d3.curveMonotoneX));

  // Max jump annotation
  if (maxYear) {
    const mx = x(maxYear);
    g.append("line").attr("x1",mx).attr("x2",mx).attr("y1",0).attr("y2",ih)
      .attr("stroke","#c0392b").attr("stroke-width",1).attr("stroke-dasharray","3,3").attr("opacity",0.6);
    g.append("text").attr("x",mx+4).attr("y",12)
      .attr("font-size","9").attr("fill","#c0392b").attr("font-family","Outfit,sans-serif").text(maxYear);
  }

  // X axis
  g.append("g").attr("transform",`translate(0,${ih})`)
    .call(d3.axisBottom(x).ticks(6).tickFormat(d3.format("d")))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line").remove())
    .call(g => g.selectAll("text")
      .attr("fill","#9898b0").attr("font-size","9").attr("font-family","Outfit,sans-serif"));

  // Y axis
  g.append("g").call(d3.axisLeft(y).ticks(5))
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll(".tick line").attr("stroke","#e0dbd0").attr("x2",iw))
    .call(g => g.selectAll("text")
      .attr("fill","#9898b0").attr("font-size","9").attr("font-family","Outfit,sans-serif"));
}

// ─────────────────────────────────────────────────────────────────────────────
//  Chapter 8 — Minority votes
// ─────────────────────────────────────────────────────────────────────────────

function buildChapter8(code, votes, suffix) {
  const country     = query("SELECT country_name FROM countries WHERE ms_code = ?", [code])[0];
  const allMinority = votes.filter(r => {
    if (r.ms_vote === "Y") return +r.total_yes < 10;
    if (r.ms_vote === "N") return +r.total_no  < 10;
    return false;
  }).sort((a, b) => (b.date ?? "").localeCompare(a.date ?? ""));

  if (!allMinority.length) return null;

  const listId = `ch8-list${suffix}`;
  const btnId  = `ch8-more${suffix}`;
  const voteLabel = { Y:"Yes", N:"No" };

  const insight = `
    <span class="hl">${country.country_name}</span> has cast votes that put it in a
    <span class="hl-red">small minority</span> of the General Assembly —
    sometimes as few as <span class="hl-red">1 of 193</span> nations.
    These votes reveal where <span class="hl">${country.country_name}</span>
    is willing to stand alone.`;

  function rowHtml(r) {
    // Find co-voters from votesCache
    const allForRes  = (votesCache.get("__all__") ?? []).filter(v =>
      v.resolution === r.resolution && v.ms_vote === r.ms_vote && v.ms_code !== code
    );
    const coVoters   = allForRes.slice(0, 10).map(v => getCountryName(v.ms_code)).join(", ");
    const coTooltip  = coVoters ? `title="Also voted ${r.ms_vote === 'Y' ? 'Yes' : 'No'}: ${coVoters}${allForRes.length > 10 ? ` (+${allForRes.length - 10} more)` : ''}"` : "";
    return `
      <div class="minority-row" ${coTooltip} style="${coVoters ? 'cursor:help;' : ''}">
        <div class="minority-title">${r.title ?? r.resolution}</div>
        ${r.subject_category ? `<div style="font-size:10px;color:var(--text-3);margin:3px 0 4px;letter-spacing:0.04em;">${r.subject_category}</div>` : ""}
        <div class="minority-meta">
          <span>${r.date}</span>
          <span>Voted: <strong>${voteLabel[r.ms_vote]}</strong></span>
          <span>Yes: ${r.total_yes} · No: ${r.total_no}</span>
          ${r.undl_link ? `<a href="${r.undl_link}" target="_blank"
            style="color:var(--accent);text-decoration:none;">↗ source</a>` : ""}
        </div>
      </div>`;
  }

  const visual = `
    <div class="minority-list" id="${listId}">${allMinority.slice(0,3).map(rowHtml).join("")}</div>
    ${allMinority.length > 3
      ? `<button class="show-more-btn" id="${btnId}">Show more (${allMinority.length - 3} more)</button>`
      : ""}`;

  return { html: makeChapter(8, insight, visual,
    "Recent votes where country was in a minority of fewer than 10", suffix), allMinority };
}

function initChapter8ShowMore(allMinority, listId, btnId) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  let showing = 3;
  const voteLabel = { Y:"Yes", N:"No" };

  btn.addEventListener("click", () => {
    if (showing > 3) {
      document.getElementById(listId).querySelectorAll(".minority-row").forEach((r, i) => {
        if (i >= 3) r.remove();
      });
      showing = 3;
      btn.textContent = `Show more (${allMinority.length - 3} more)`;
      return;
    }
    const list = document.getElementById(listId);
    allMinority.slice(3).forEach(r => {
      const div = document.createElement("div");
      div.className = "minority-row";
      div.innerHTML = `
        <div class="minority-title">${r.title ?? r.resolution}</div>
        <div class="minority-meta">
          <span>${r.date}</span>
          <span>Voted: <strong>${voteLabel[r.ms_vote]}</strong></span>
          <span>Yes: ${r.total_yes} · No: ${r.total_no}</span>
          ${r.undl_link ? `<a href="${r.undl_link}" target="_blank"
            style="color:var(--accent);text-decoration:none;">↗ source</a>` : ""}
        </div>`;
      list.appendChild(div);
    });
    showing = allMinority.length;
    btn.textContent = "Show less";
  });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Build story into a container
// ─────────────────────────────────────────────────────────────────────────────

function buildStory(code, votes, containerId) {
  const suffix = containerId === "story-left" ? "-left" : "-right";

  const ch1     = buildChapter1(code, votes, suffix);
  const ch2res  = buildChapter2(code, suffix);
  const ch4     = buildChapter4(code, suffix);
  const ch3ares = buildChapter3a(code, suffix);
  const ch3bres = ch3ares ? buildChapter3b(code, suffix, ch3ares.threshold) : null;
  const ch5res  = buildChapter5(code, votes, suffix);
  const ch6     = buildChapter6(code, suffix);
  const ch7res  = buildChapter7(code, suffix);
  const ch8res  = buildChapter8(code, votes, suffix);

  const chapters = [
    ch1, ch2res?.html, ch4, ch3ares?.html, ch3bres?.html,
    ch5res?.html, ch6, ch7res?.html, ch8res?.html,
  ].filter(Boolean);

  const container = document.getElementById(containerId);
  container.innerHTML = chapters.join("") + `
    <div class="detail-link-wrap">
      <a class="detail-link" href="country.html?code=${code}">Explore full data →</a>
    </div>`;

  // Init interactive elements
  initShowMore(code, `ch3a-list${suffix}`, `ch3a-more${suffix}`, suffix, "DESC");
  initShowMore(code, `ch3b-list${suffix}`, `ch3b-more${suffix}`, suffix, "ASC");
  if (ch8res) initChapter8ShowMore(ch8res.allMinority, `ch8-list${suffix}`, `ch8-more${suffix}`);

  // Init scroll observer for this container
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  container.querySelectorAll(".chapter").forEach(ch => observer.observe(ch));
}

// ─────────────────────────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────────────────────────

// Expose openCompare globally so inline onclick handlers can call it
window.openCompare = openCompare;

(async () => {
  if (!PRIMARY) {
    document.getElementById("loading-text").textContent     = "No country code in URL";
    document.getElementById("loading-progress").textContent = "Add ?code=AUT to the URL.";
    return;
  }

  try {
    await loadDatabase();

    document.getElementById("loading-text").textContent = "Loading voting record";
    const votes = await getVotes(PRIMARY);

    document.getElementById("page-loading").style.display = "none";
    document.getElementById("story-wrap").style.display   = "flex";

    // Set page title and nav tab
    const countryName = getCountryName(PRIMARY);
    document.title = `${countryName} — Who Votes With Whom`;
    document.getElementById("country-tab").textContent = countryName;

    // Build primary story
    buildStory(PRIMARY, votes, "story-left");

    // Render D3 charts for left column once it has real dimensions
    const dnaElLeft = document.getElementById("dna-svg-left");
    if (dnaElLeft) {
      const obs = new ResizeObserver(entries => {
        for (const entry of entries) {
          if (entry.contentRect.width > 0) {
            obs.disconnect();
            renderDNA(PRIMARY, "dna-svg-left");
            renderDotPlot(PRIMARY, "dotplot-svg-left");
            renderIdealpointChart(PRIMARY, "idealpoint-svg-left");
          }
        }
      });
      obs.observe(dnaElLeft);
    }

    // If compare param exists on load, open immediately
    if (COMPARE_CODE) {
      renderCompare(COMPARE_CODE);
    }

    // Close button
    document.getElementById("close-compare").addEventListener("click", closeCompare);

  } catch(err) {
    console.error("Boot error:", err);
    document.getElementById("loading-text").textContent     = "Error loading data";
    document.getElementById("loading-progress").textContent = err.message;
  }
})();
</script>
